name: parity-matrix

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: .cargo-target

jobs:
  full-suite:
    name: "Full suite (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run all unit and integration targets
        env:
          AFS_LD_HELLO_BUDGET_MS: "20"
          AFS_LD_RUNTIME_BUDGET_MS: "150"
          PARITY_MATRIX_ARTIFACT_DIR: ${{ github.workspace }}/parity-matrix-artifacts
          PARITY_MATRIX_MAX_SECONDS: "120"
        run: cargo test --all-targets -- --nocapture

      - name: Upload parity artifacts
        if: always() && matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: parity-matrix-html
          path: parity-matrix-artifacts
          if-no-files-found: warn

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy on every target
        run: cargo clippy --all-targets -- -D warnings
