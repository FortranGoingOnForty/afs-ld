name: parity-matrix

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: .cargo-target

jobs:
  full-suite:
    name: "Full suite (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            skip_profile: macos
          - os: ubuntu-latest
            skip_profile: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run all unit and integration targets
        env:
          PARITY_MATRIX_ARTIFACT_DIR: ${{ github.workspace }}/parity-matrix-artifacts
          PARITY_MATRIX_MAX_SECONDS: "120"
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets -- --nocapture --test-threads=1 2>&1 | tee /tmp/afs-ld-tests.log

      - name: Validate prerequisite skips
        run: ci/check_skips.sh /tmp/afs-ld-tests.log "${{ matrix.skip_profile }}"

      - name: Run isolated performance gate
        if: matrix.os == 'macos-14'
        env:
          AFS_LD_HELLO_BUDGET_MS: "20"
          AFS_LD_RUNTIME_BUDGET_MS: "150"
          AFS_LD_REQUIRE_PERF_PREREQUISITES: "1"
        run: cargo test --test perf_baseline -- --nocapture --test-threads=1

      - name: Upload parity artifacts
        if: always() && matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: parity-matrix-html
          path: parity-matrix-artifacts
          if-no-files-found: warn

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy on every target
        run: cargo clippy --all-targets -- -D warnings
